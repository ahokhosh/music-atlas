<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/playlist.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07070d" />
    
    <!-- Primary SEO -->
    <title>Music Atlas — Free Music Streaming, World Charts & Playlist Import</title>
    <meta name="description" content="Search and stream millions of songs for free. Full-length tracks, per-country charts, curated genre packs, and one-click playlist import — no ads, no limits." />
    <meta name="keywords" content="soundcloud player, free music streaming, soundcloud playlist import, world music charts, top hits by country, music atlas, bidbes, lofi beats, viral songs, persian pop, kpop charts" />
    <meta name="author" content="Music Atlas" />
    <link rel="canonical" href="https://example.com/music-atlas/" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://example.com/music-atlas/" />
    <meta property="og:title" content="Music Atlas — Free Music Streaming & World Charts" />
    <meta property="og:description" content="Discover and stream millions of songs with per-country charts, genre packs, and zero limits." />
    <meta property="og:image" content="https://example.com/icons/bidbes-1200.png" />
    <meta property="og:site_name" content="Music Atlas" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Music Atlas — Music of Every Nation" />
    <meta name="twitter:description" content="Explore live trending music charts for every country on Earth and play playlists instantly." />
    <meta name="twitter:image" content="https://example.com/icons/bidbes-1200.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Structured Data (JSON-LD) for SEO, GEO & AEO (AI Engines) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "@id": "https://example.com/music-atlas/#webapp",
          "name": "Music Atlas",
          "url": "https://example.com/music-atlas/",
          "applicationCategory": "MultimediaApplication",
          "operatingSystem": "All",
          "browserRequirements": "Requires JavaScript. Requires HTML5.",
          "description": "Stream millions of songs with real-time per-country charts and one-click playlist imports.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "featureList": [
            "Full-length streaming with zero subscription",
            "Real-time trending music charts for countries worldwide",
            "Direct playlist, set, and track imports",
            "Custom cloud playlist creation"
          ]
        },
        {
          "@type": "MusicPlaylist",
          "name": "Music Atlas Global Hits & Charts",
          "numTracks": "249",
          "description": "Global trending charts curated for every nation across Earth.",
          "spatialCoverage": "Global"
        }
      ]
    }
    </script>
  </head>
  <body class="bg-[#07070d] text-white antialiased"><h1 style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;">Music Atlas — Free Music Streaming, World Charts &amp; Playlists</h1>
    <div id="root"></div>
    <noscript><p style="text-align:center;padding:2rem">Music Atlas streams millions of songs with per-country charts and genre packs. Enable JavaScript to play music. See <a href="https://example.com/music-atlas/about">About</a>.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
